<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Mengganggu</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffcc00;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
            animation: backgroundChange 5s infinite alternate;
        }

        @keyframes backgroundChange {
            0% { background-color: #ffcc00; }
            100% { background-color: #ff6699; }
        }

        .text {
            font-size: 48px;
            color: #ff0000;
            text-shadow: 2px 2px 4px #000000;
            animation: shake 0.5s infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            25% { transform: translate(-1px, -2px); }
            50% { transform: translate(-3px, 0px); }
            75% { transform: translate(3px, 2px); }
            100% { transform: translate(1px, -1px); }
        }

        .button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 24px;
            background-color: #ff0000;
            color: white;
            border: none;
            cursor: pointer;
            animation: bounce 1s infinite;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        .button:hover {
            transform: scale(1.1);
            background-color: #ff3333;
        }

        .confetti {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .confetti div {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ff00ff;
            opacity: 0.8;
            animation: fall 3s infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
    </style>
</head>
<body>
    <div class="confetti">
        <div style="left: 10%; animation-delay: 0s;"></div>
        <div style="left: 20%; animation-delay: 0.5s;"></div>
        <div style="left: 30%; animation-delay: 1s;"></div>
        <div style="left: 40%; animation-delay: 1.5s;"></div>
        <div style="left: 50%; animation-delay: 2s;"></div>
        <div style="left: 60%; animation-delay: 2.5s;"></div>
        <div style="left: 70%; animation-delay: 3s;"></div>
        <div style="left: 80%; animation-delay: 3.5s;"></div>
        <div style="left: 90%; animation-delay: 4s;"></div>
    </div>
    <div>
        <div class="text">Hayang Modol 😜😜</div>
        <button class="button" onclick="alert('Jangan klik saya!')">Lollll
        !</button>
    </div>
</body>
</html>
